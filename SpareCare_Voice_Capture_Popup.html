<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpareCare Voice</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f7fbfc;color:#234452;overflow:hidden}
.box{padding:12px;box-sizing:border-box}
.title{font-size:15px;font-weight:800;margin-bottom:8px}
.lang{width:100%;height:32px;border:1px solid #c8d8de;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700}
.row{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;height:34px;border:0;border-radius:6px;color:#fff;font-size:12px;font-weight:800;cursor:pointer}
.btn.start{background:#168a9a}.btn.stop{background:#c62828}.btn.ok{background:#2e7d32}.btn.cancel{background:#607d8b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:7px;font-size:11px;color:#607d8b;min-height:15px}
.result{margin-top:7px;background:#fff;border:1px solid #c8d8de;border-radius:6px;padding:7px;height:58px;box-sizing:border-box;font-size:12px;line-height:1.35;overflow:auto;white-space:pre-wrap}
.small{font-size:9px;color:#78909c;margin-top:5px;line-height:1.2}
</style>
</head>
<body>
<div class="box">
<div class="title">🎙 Voice → English</div>
<select id="lang" class="lang">
<option value="hi-IN">Hindi</option>
<option value="bn-IN">Bengali</option>
<option value="or-IN">Odia</option>
<option value="en-IN">English</option>
<option value="mr-IN">Marathi</option>
<option value="ta-IN">Tamil</option>
<option value="te-IN">Telugu</option>
<option value="kn-IN">Kannada</option>
<option value="gu-IN">Gujarati</option>
</select>
<div class="row">
<button id="start" class="btn start">🎙 Speak</button>
<button id="stop" class="btn stop" disabled>⏹ Stop</button>
</div>
<div id="status" class="status">Click Speak and allow microphone access.</div>
<div id="result" class="result">Your English translation will appear here.</div>
<div class="row">
<button id="ok" class="btn ok" disabled>✓ OK — Put in MoM</button>
<button id="cancel" class="btn cancel">Cancel</button>
</div>
<div class="small">Speech → Text → English → Grammar correction</div>
</div>
<script>
(function(){
'use strict';
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,finalText='',translatedText='';
var lang=new URLSearchParams(location.search).get('lang')||'hi-IN';
var $=function(id){return document.getElementById(id)};
$('lang').value=lang;
function send(type,extra){if(window.opener&&!window.opener.closed){window.opener.postMessage(Object.assign({source:'SPARECARE_VOICE_CAPTURE',type:type},extra||{}),'*')}}
function status(x){$('status').textContent=x;send('STATUS',{message:x})}
$('lang').onchange=function(){lang=this.value};
$('start').onclick=function(){
if(!SR){status('Speech recognition is not supported. Please use Google Chrome.');return}
finalText='';translatedText='';$('result').textContent='Listening…';$('ok').disabled=true;
rec=new SR();rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
rec.onstart=function(){status('Listening… speak now.');$('start').disabled=true;$('stop').disabled=false};
rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';finalText=t.trim();$('result').textContent=finalText;status('Speech captured. Translating to English…');send('RESULT',{sourceText:finalText,sourceLanguage:lang});$('start').disabled=false;$('stop').disabled=true};
rec.onerror=function(e){status('Voice error: '+e.error);$('start').disabled=false;$('stop').disabled=true};
rec.onend=function(){$('start').disabled=false;$('stop').disabled=true;if(!finalText&&$('result').textContent==='Listening…')status('No speech detected.')};
try{rec.start()}catch(e){status('Unable to start microphone: '+e.message);$('start').disabled=false;$('stop').disabled=true}
};
$('stop').onclick=function(){if(rec){try{rec.stop()}catch(e){}}};
$('ok').onclick=function(){send('OK',{text:translatedText||$('result').textContent||''});window.close()};
$('cancel').onclick=function(){send('CLOSED',{});window.close()};
window.addEventListener('message',function(e){if(!e.data||e.data.source!=='PRO_BDM_MOM')return;if(e.data.type==='TRANSLATION'){translatedText=String(e.data.text||'').trim();$('result').textContent=translatedText;$('ok').disabled=!translatedText;status('Translation ready. Click OK to insert into MoM.')}});
send('READY',{});
})();
</script>
</body>
</html>
